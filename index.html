<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:flex-end;justify-content:center}
.ame{height:100%;background-repeat:no-repeat}
/* The picker also works in a regular card without the optional host patch. */
.pick{position:fixed;top:6px;right:46px;width:34px;height:34px;box-sizing:border-box;border:1px solid #ffffff2b;border-radius:10px;
  display:grid;place-items:center;color:#f5f3fa;background:#20222bcf;box-shadow:0 8px 22px #0005;
  font:22px/1 sans-serif;cursor:pointer;opacity:0;transition:opacity .18s ease,background .18s ease}
.pick::before{content:"\2699"}
body:hover .pick,.pick:focus-visible,.pick[aria-expanded="true"]{opacity:1}
.pick:hover,.pick[aria-expanded="true"]{background:#30313de8}
.pick:focus-visible,.mode-option:focus-visible{outline:2px solid #d994ff;outline-offset:2px}
.pick-menu{position:fixed;top:47px;right:46px;width:min(216px,calc(100vw - 58px));max-height:min(358px,calc(100vh - 58px));
  box-sizing:border-box;padding:6px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#8a8392 transparent;
  border:1px solid #ffffff30;border-radius:15px;
  background:#20212a;box-shadow:0 16px 38px #0009;z-index:2;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s ease,visibility 0s linear .2s}
.pick-menu.is-open{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .2s ease,visibility 0s}
.mode-option{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:7px 9px;border:0;border-radius:9px;
  background:transparent;color:#f4f4f7;text-align:left;font:600 13px/1.25 system-ui,sans-serif;cursor:pointer}
.mode-option::before{content:"";flex:none;width:13px;height:13px;border:1px solid #a5a5af;border-radius:4px;background:#ffffff12}
.mode-option:hover,.mode-option:focus-visible{background:#ffffff16}
.mode-option[aria-checked="true"]{background:#b881e329}
.mode-option[aria-checked="true"]::before{border-color:#d4a5f1;background:#b96ee5;box-shadow:inset 0 0 0 3px #29212f}
@media(prefers-reduced-motion:reduce){.pick,.pick-menu{transition:none}}
</style></head><body><div class="ame"></div>
<button class="pick" id="mode-toggle" type="button" title="Выбрать действие" aria-label="Выбрать действие" aria-haspopup="menu" aria-expanded="false" aria-controls="mode-menu"></button>
<div class="pick-menu" id="mode-menu" role="menu" aria-label="Действия Аме-чан"></div>
<script src="ame-frames.js"></script>
<script src="ame.js"></script>
</body></html>
