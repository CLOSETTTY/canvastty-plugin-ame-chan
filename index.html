<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:flex-end;justify-content:center}
.ame{height:100%;background-repeat:no-repeat}
/* The picker also works in a regular card without the optional host patch. */
.pick{position:fixed;top:6px;right:46px;width:34px;height:34px;box-sizing:border-box;border-radius:9px;
  display:grid;place-items:center;color:#ffffffb8;background:#161b22c9;opacity:0;transition:opacity .15s}
body:hover .pick,.pick:focus-within{opacity:1}
.pick::before{content:"\2699";font:22px/1 sans-serif}
.pick:focus-within{outline:2px solid #d994ff;outline-offset:2px}
.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
</style></head><body><div class="ame"></div>
<label class="pick" title="Choose animation">
  <select id="mode" aria-label="Animation"></select>
</label>
<script src="ame-frames.js"></script>
<script src="ame.js"></script>
</body></html>
